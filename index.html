<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎰 Real Slots Casino</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0a0a0a;
            min-height: 100vh;
            color: white;
            overflow-x: hidden;
        }
        .container { max-width: 1400px; margin: 0 auto; padding: 20px; }
        
        /* Header */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding: 15px 25px;
            background: linear-gradient(145deg, #1a1a2e, #0f0f1a);
            border-radius: 12px;
            border: 2px solid #ffd700;
        }
        .logo { font-size: 1.8rem; font-weight: bold; color: #ffd700; }
        .user-info { display: flex; gap: 15px; align-items: center; }
        .balance-box {
            background: linear-gradient(145deg, #16a34a, #059669);
            padding: 10px 20px;
            border-radius: 8px;
            font-size: 1.2rem;
            font-weight: bold;
        }
        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
        }
        .btn-add { background: #16a34a; color: white; }
        .btn-add:hover { background: #15803d; }
        .btn-logout { background: #dc2626; color: white; }
        .btn-logout:hover { background: #b91c1c; }

        /* Game Tabs */
        .game-tabs {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 20px;
        }
        .game-tab {
            padding: 12px 25px;
            background: linear-gradient(145deg, #1e293b, #0f172a);
            border: 2px solid #334155;
            border-radius: 10px;
            color: #94a3b8;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s;
        }
        .game-tab:hover { border-color: #ffd700; color: white; }
        .game-tab.active {
            background: linear-gradient(145deg, #ffd700, #f59e0b);
            color: #000;
            border-color: #ffd700;
        }

        /* Game Container */
        .game-container {
            background: linear-gradient(180deg, #1a1a2e, #0a0a0a);
            border-radius: 20px;
            padding: 30px;
            border: 3px solid #ffd700;
            margin-bottom: 20px;
        }

        /* ========== SUPER ACE (5x4 Grid) ========== */
        .super-ace-layout {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 8px;
            background: linear-gradient(180deg, #2d1a44, #1a0a2e);
            padding: 20px;
            border-radius: 15px;
            border: 2px solid #9333ea;
        }
        .super-ace-reel {
            display: flex;
            flex-direction: column;
            gap: 8px;
            background: #0a0a0a;
            padding: 10px;
            border-radius: 10px;
            border: 2px solid #555;
            min-height: 320px;
        }
        .super-ace-symbol {
            height: 80px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.5rem;
            background: linear-gradient(145deg, #1e293b, #0f172a);
            border-radius: 8px;
            border: 1px solid #444;
            transition: all 0.3s;
        }
        .super-ace-symbol.win {
            background: linear-gradient(145deg, #9333ea, #7c3aed);
            box-shadow: 0 0 20px #9333ea;
            animation: winPulse 0.5s ease infinite;
        }

        /* ========== FORTUNE GEMS (4x3 Grid) ========== */
        .fortune-gems-layout {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            background: linear-gradient(180deg, #1a4444, #0a2e2e);
            padding: 20px;
            border-radius: 15px;
            border: 2px solid #14b8a6;
        }
        .fortune-gems-reel {
            display: flex;
            flex-direction: column;
            gap: 10px;
            background: #0a0a0a;
            padding: 10px;
            border-radius: 10px;
            border: 2px solid #555;
            min-height: 240px;
        }
        .fortune-gems-symbol {
            height: 80px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.5rem;
            background: linear-gradient(145deg, #1e293b, #0f172a);
            border-radius: 8px;
            border: 1px solid #444;
        }
        .fortune-gems-symbol.win {
            background: linear-gradient(145deg, #14b8a6, #0d9488);
            box-shadow: 0 0 20px #14b8a6;
            animation: gemShine 0.5s ease infinite;
        }
        @keyframes gemShine {
            0%, 100% { filter: brightness(1); }
            50% { filter: brightness(1.5); }
        }

        /* ========== LUCKY 777 (3x1 Classic) ========== */
        .lucky-777-layout {
            display: flex;
            justify-content: center;
            gap: 15px;
            background: linear-gradient(180deg, #441a1a, #2e0a0a);
            padding: 30px;
            border-radius: 15px;
            border: 2px solid #dc2626;
        }
        .lucky-777-reel {
            width: 120px;
            height: 120px;
            background: linear-gradient(180deg, #fbbf24, #f59e0b);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 4rem;
            border: 3px solid #7c2d12;
            box-shadow: inset 0 0 30px rgba(0,0,0,0.5);
        }
        .lucky-777-reel.win {
            animation: jackpotSpin 0.3s ease infinite;
        }
        @keyframes jackpotSpin {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }

        /* Spinning Animation */
        .spinning .symbol-content {
            animation: blurSpin 0.1s linear infinite;
        }
        @keyframes blurSpin {
            0% { filter: blur(0); transform: translateY(-2px); }
            50% { filter: blur(3px); transform: translateY(2px); }
            100% { filter: blur(0); transform: translateY(-2px); }
        }

        /* Controls */
        .controls {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
            margin-top: 20px;
            flex-wrap: wrap;
        }
        .bet-control {
            display: flex;
            align-items: center;
            gap: 10px;
            background: rgba(0,0,0,0.5);
            padding: 10px 20px;
            border-radius: 10px;
        }
        .bet-control label { color: #94a3b8; }
        .bet-input {
            width: 100px;
            padding: 10px;
            border: 2px solid #ffd700;
            border-radius: 8px;
            background: #0a0a0a;
            color: #ffd700;
            font-size: 1.2rem;
            text-align: center;
            font-weight: bold;
        }
        .bet-btn {
            width: 35px;
            height: 35px;
            border-radius: 8px;
            border: none;
            background: #ffd700;
            color: #000;
            font-size: 1.2rem;
            cursor: pointer;
            font-weight: bold;
        }
        .spin-btn {
            padding: 15px 50px;
            font-size: 1.5rem;
            font-weight: bold;
            background: linear-gradient(145deg, #ffd700, #f59e0b);
            color: #000;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.5);
        }
        .spin-btn:hover { transform: scale(1.05); }
        .spin-btn:disabled { background: #444; color: #888; cursor: not-allowed; box-shadow: none; }
        .auto-btn {
            padding: 12px 25px;
            font-size: 1rem;
            background: #3b82f6;
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
        }
        .auto-btn.active { background: #dc2626; animation: pulse 1s infinite; }
        @keyframes pulse { 0%, 100% { box-shadow: 0 0 10px #dc2626; } 50% { box-shadow: 0 0 25px #dc2626; } }

        /* Win Display */
        .win-display {
            text-align: center;
            padding: 15px;
            background: rgba(0,0,0,0.5);
            border-radius: 12px;
            margin-top: 15px;
            min-height: 70px;
        }
        .win-amount { font-size: 2rem; color: #4ade80; font-weight: bold; }
        .win-message { font-size: 1.2rem; color: #ffd700; margin-top: 5px; }

        /* Stats */
        .stats {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            margin-top: 20px;
        }
        .stat-box {
            background: rgba(0,0,0,0.5);
            padding: 15px;
            border-radius: 10px;
            text-align: center;
        }
        .stat-label { color: #94a3b8; font-size: 0.85rem; }
        .stat-value { color: #ffd700; font-size: 1.3rem; font-weight: bold; }

        /* Login Modal */
        .login-modal {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.95);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }
        .login-box {
            background: linear-gradient(145deg, #1a1a2e, #0f0f1a);
            padding: 40px;
            border-radius: 20px;
            width: 100%;
            max-width: 400px;
            border: 3px solid #ffd700;
        }
        .login-box h2 { text-align: center; margin-bottom: 25px; color: #ffd700; font-size: 1.8rem; }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; margin-bottom: 8px; color: #94a3b8; }
        .form-group input {
            width: 100%;
            padding: 12px;
            border: 2px solid #334155;
            border-radius: 10px;
            background: #0a0a0a;
            color: white;
            font-size: 1rem;
        }
        .form-group input:focus { outline: none; border-color: #ffd700; }
        .submit-btn {
            width: 100%;
            padding: 15px;
            background: linear-gradient(145deg, #ffd700, #f59e0b);
            color: #000;
            border: none;
            border-radius: 10px;
            font-size: 1.2rem;
            font-weight: bold;
            cursor: pointer;
        }
        .hidden { display: none; }

        /* Responsive */
        @media (max-width: 768px) {
            .super-ace-layout { grid-template-columns: repeat(5, 1fr); gap: 4px; }
            .super-ace-symbol { height: 50px; font-size: 1.5rem; }
            .fortune-gems-layout { grid-template-columns: repeat(4, 1fr); }
            .fortune-gems-symbol { height: 50px; font-size: 1.5rem; }
            .stats { grid-template-columns: repeat(2, 1fr); }
        }
    </style>
</head>
<body>
    <!-- Login -->
    <div id="loginModal" class="login-modal">
        <div class="login-box">
            <h2>🎰 Real Slots Casino</h2>
            <div class="form-group">
                <label>Username</label>
                <input type="text" id="username" placeholder="Enter username">
            </div>
            <button class="submit-btn" onclick="login()">🎮 Play Now</button>
            <p style="text-align: center; margin-top: 20px; color: #94a3b8; font-size: 0.9rem;">
                🎁 Get ৳10,000 FREE Credits!
            </p>
        </div>
    </div>

    <!-- Main App -->
    <div id="app" class="container hidden">
        <header>
            <div class="logo">🎰 SLOTS</div>
            <div class="user-info">
                <div class="balance-box">৳<span id="balance">10,000</span></div>
                <button class="btn btn-add" onclick="addCredits()">+ Add</button>
                <button class="btn btn-logout" onclick="logout()">Logout</button>
            </div>
        </header>

        <!-- Game Tabs -->
        <div class="game-tabs">
            <div class="game-tab active" onclick="selectGame('super_ace')">🃏 Super Ace</div>
            <div class="game-tab" onclick="selectGame('fortune_gems')">💎 Fortune Gems</div>
            <div class="game-tab" onclick="selectGame('lucky_777')">🎰 Lucky 777</div>
        </div>

        <!-- Game Container -->
        <div class="game-container">
            <div id="gameLayout"></div>
            
            <div class="win-display">
                <div class="win-amount" id="winAmount">৳0</div>
                <div class="win-message" id="winMessage">Good Luck! 🍀</div>
            </div>

            <div class="controls">
                <div class="bet-control">
                    <label>Bet:</label>
                    <button class="bet-btn" onclick="adjustBet(-50)">-</button>
                    <input type="number" class="bet-input" id="betAmount" value="100" min="50" step="50">
                    <button class="bet-btn" onclick="adjustBet(50)">+</button>
                </div>
                <button class="spin-btn" id="spinBtn" onclick="spin()">🎲 SPIN</button>
                <button class="auto-btn" id="autoBtn" onclick="toggleAuto()">AUTO</button>
            </div>

            <div class="stats">
                <div class="stat-box">
                    <div class="stat-label">Spins</div>
                    <div class="stat-value" id="totalSpins">0</div>
                </div>
                <div class="stat-box">
                    <div class="stat-label">Won</div>
                    <div class="stat-value" id="totalWon">৳0</div>
                </div>
                <div class="stat-box">
                    <div class="stat-label">Biggest</div>
                    <div class="stat-value" id="biggestWin">৳0</div>
                </div>
                <div class="stat-box">
                    <div class="stat-label">Win Rate</div>
                    <div class="stat-value" id="winRate">0%</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Game Configs - 3 Different Games
        const games = {
            super_ace: {
                name: '🃏 Super Ace',
                layout: '5x4',
                symbols: ['🂡', '🂫', '👸', '🂮', '♠️'],
                payouts: { 5: { '🂡': 500, '🂫': 200, '👸': 100, '🂮': 50, '♠️': 1000 }, 4: { '🂡': 50, '🂫': 20, '👸': 10, '🂮': 5, '♠️': 100 }, 3: { '🂡': 10, '🂫': 5, '👸': 3, '🂮': 2, '♠️': 20 } },
                weights: [10, 18, 22, 25, 5],
                theme: 'purple'
            },
            fortune_gems: {
                name: '💎 Fortune Gems',
                layout: '4x3',
                symbols: ['💎', '🔷', '🔶', '💠', '⭐', '👑'],
                payouts: { 4: { '💎': 500, '🔷': 150, '🔶': 100, '💠': 50, '⭐': 25, '👑': 1000 }, 3: { '💎': 50, '🔷': 15, '🔶': 10, '💠': 5, '⭐': 3, '👑': 100 } },
                weights: [8, 15, 18, 22, 25, 3],
                theme: 'teal'
            },
            lucky_777: {
                name: '🎰 Lucky 777',
                layout: '3x1',
                symbols: ['7️⃣', '🔔', '🍒', '🍋', '🍊'],
                payouts: { 3: { '7️⃣': 1000, '🔔': 200, '🍒': 100, '🍋': 50, '🍊': 30 } },
                weights: [5, 12, 25, 28, 30],
                theme: 'red'
            }
        };

        // State
        let user = null, balance = 10000, currentGame = 'super_ace';
        let bet = 100, isSpinning = false, autoPlay = false;
        let stats = { spins: 0, won: 0, biggest: 0, wins: 0 };

        function login() {
            const username = document.getElementById('username').value.trim();
            if (!username) { alert('Enter username!'); return; }
            user = username;
            document.getElementById('loginModal').classList.add('hidden');
            document.getElementById('app').classList.remove('hidden');
            renderGame();
        }

        function logout() {
            user = null; balance = 10000; stats = { spins: 0, won: 0, biggest: 0, wins: 0 };
            stopAuto();
            document.getElementById('loginModal').classList.remove('hidden');
            document.getElementById('app').classList.add('hidden');
        }

        function addCredits() { balance += 5000; updateBalance(); showToast('+৳5,000!'); }
        function updateBalance() { document.getElementById('balance').textContent = balance.toLocaleString(); }

        function selectGame(game) {
            if (isSpinning) return;
            currentGame = game;
            document.querySelectorAll('.game-tab').forEach((t, i) => {
                t.classList.toggle('active', Object.keys(games)[i] === game);
            });
            renderGame();
        }

        function renderGame() {
            const game = games[currentGame];
            const layout = document.getElementById('gameLayout');
            
            if (game.layout === '5x4') {
                layout.className = 'super-ace-layout';
                layout.innerHTML = Array(5).fill(0).map((_, i) => 
                    `<div class="super-ace-reel" id="reel${i+1}">
                        ${Array(4).fill(0).map(() => 
                            `<div class="super-ace-symbol"><span class="symbol-content">${game.symbols[Math.floor(Math.random()*game.symbols.length)]}</span></div>`
                        ).join('')}
                    </div>`
                ).join('');
            } else if (game.layout === '4x3') {
                layout.className = 'fortune-gems-layout';
                layout.innerHTML = Array(4).fill(0).map((_, i) => 
                    `<div class="fortune-gems-reel" id="reel${i+1}">
                        ${Array(3).fill(0).map(() => 
                            `<div class="fortune-gems-symbol"><span class="symbol-content">${game.symbols[Math.floor(Math.random()*game.symbols.length)]}</span></div>`
                        ).join('')}
                    </div>`
                ).join('');
            } else {
                layout.className = 'lucky-777-layout';
                layout.innerHTML = Array(3).fill(0).map((_, i) => 
                    `<div class="lucky-777-reel" id="reel${i+1}">${game.symbols[Math.floor(Math.random()*game.symbols.length)]}</div>`
                ).join('');
            }
        }

        function adjustBet(amt) {
            if (isSpinning) return;
            const input = document.getElementById('betAmount');
            let newBet = parseInt(input.value) + amt;
            newBet = Math.max(50, Math.min(newBet, balance, 10000));
            input.value = newBet; bet = newBet;
        }

        function spin() {
            if (isSpinning) return;
            if (bet > balance) { showToast('❌ No balance!'); return; }

            isSpinning = true; balance -= bet; updateBalance();
            stats.spins++; updateStats();
            document.getElementById('spinBtn').disabled = true;
            document.getElementById('winAmount').textContent = '৳0';
            document.getElementById('winMessage').textContent = 'Spinning... 🎰';

            const game = games[currentGame];
            const result = [];
            
            // Generate result
            const totalSymbols = game.layout === '5x4' ? 20 : game.layout === '4x3' ? 12 : 3;
            for (let i = 0; i < totalSymbols; i++) {
                result.push(getWeightedSymbol(game));
            }

            // Spin animation
            const reels = document.querySelectorAll('[id^="reel"]');
            reels.forEach((reel, i) => {
                reel.classList.add('spinning');
                setTimeout(() => {
                    reel.classList.remove('spinning');
                    const symbolsInReel = game.layout === '5x4' ? 4 : game.layout === '4x3' ? 3 : 1;
                    const startIndex = i * symbolsInReel;
                    
                    if (game.layout === '3x1') {
                        reel.textContent = result[i];
                    } else {
                        const symbolEls = reel.querySelectorAll('.symbol-content');
                        symbolEls.forEach((el, j) => {
                            el.textContent = result[startIndex + j];
                        });
                    }
                    
                    if (i === reels.length - 1) {
                        checkWin(result);
                    }
                }, 400 + (i * 200));
            });
        }

        function getWeightedSymbol(game) {
            const total = game.weights.reduce((a, b) => a + b, 0);
            let rand = Math.random() * total;
            for (let i = 0; i < game.symbols.length; i++) {
                rand -= game.weights[i];
                if (rand <= 0) return game.symbols[i];
            }
            return game.symbols[0];
        }

        function checkWin(result) {
            const game = games[currentGame];
            let win = 0;
            const symbolCounts = {};
            
            result.forEach(s => { symbolCounts[s] = (symbolCounts[s] || 0) + 1; });
            
            for (const [symbol, count] of Object.entries(symbolCounts)) {
                if (game.payouts[count] && game.payouts[count][symbol]) {
                    win = Math.max(win, bet * game.payouts[count][symbol]);
                }
            }

            if (win > 0) {
                balance += win;
                stats.won += win;
                if (win > stats.biggest) stats.biggest = win;
                stats.wins++;
                
                document.getElementById('winAmount').textContent = `৳${win.toLocaleString()}`;
                document.getElementById('winMessage').textContent = '🎉 WINNER!';
                showToast(`🎉 Won ৳${win.toLocaleString()}!`);
                
                // Highlight winning symbols
                document.querySelectorAll('.symbol-content, .lucky-777-reel').forEach(el => {
                    if (result.includes(el.textContent)) {
                        el.parentElement.classList.add('win');
                    }
                });
            } else {
                document.getElementById('winMessage').textContent = 'Try Again! 🍀';
            }

            updateBalance(); updateStats();
            isSpinning = false;
            document.getElementById('spinBtn').disabled = false;

            setTimeout(() => {
                document.querySelectorAll('.win').forEach(el => el.classList.remove('win'));
            }, 2000);

            if (autoPlay && balance >= bet) {
                setTimeout(spin, 1500);
            } else if (autoPlay) {
                stopAuto();
            }
        }

        function toggleAuto() {
            if (autoPlay) { stopAuto(); return; }
            if (balance < bet) { showToast('❌ No balance!'); return; }
            autoPlay = true;
            document.getElementById('autoBtn').classList.add('active');
            document.getElementById('autoBtn').textContent = 'STOP';
            spin();
        }

        function stopAuto() {
            autoPlay = false;
            document.getElementById('autoBtn').classList.remove('active');
            document.getElementById('autoBtn').textContent = 'AUTO';
        }

        function updateStats() {
            document.getElementById('totalSpins').textContent = stats.spins;
            document.getElementById('totalWon').textContent = `৳${stats.won.toLocaleString()}`;
            document.getElementById('biggestWin').textContent = `৳${stats.biggest.toLocaleString()}`;
            document.getElementById('winRate').textContent = stats.spins > 0 ? `${((stats.wins/stats.spins)*100).toFixed(1)}%` : '0%';
        }

        function showToast(msg) {
            const toast = document.createElement('div');
            toast.textContent = msg;
            toast.style.cssText = `position:fixed;top:20px;left:50%;transform:translateX(-50%);background:linear-gradient(145deg,#ffd700,#f59e0b);color:#000;padding:12px 25px;border-radius:10px;font-weight:bold;z-index:2000;`;
            document.body.appendChild(toast);
            setTimeout(() => toast.remove(), 2000);
        }

        document.getElementById('username').addEventListener('keypress', e => { if (e.key === 'Enter') login(); });
    </script>
</body>
</html>
