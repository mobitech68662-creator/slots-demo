version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: slots-demo-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: slots
      POSTGRES_PASSWORD: slots_demo_2024
      POSTGRES_DB: slots_demo
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U slots"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
